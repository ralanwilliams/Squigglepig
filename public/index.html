<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app's safe-area insets work around notches. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Squigglepig | Draw Squiggles, Get Giggles</title>
    <meta name="description" content="A real-time drawing telephone party game. A prompt becomes a drawing becomes a guess becomes the next drawing, passed around the whole group." />
    <!-- The browser's toolbar / status bar. Installed (Add to Home Screen) it's
         always black, whatever the palette. In a tab it's classic teal, or the
         dark palette's background in dark mode, until the app takes over
         (app/_layout.tsx sets it from the palette showing, theme and all).
         The first tag that matches wins, so the installed one goes first. -->
    <meta name="theme-color" content="#000000" media="(display-mode: standalone)" />
    <meta name="theme-color" content="#4ECDC4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1F23" media="(prefers-color-scheme: dark)" />

    <!-- Add to Home Screen: opens full-screen like the app. No service worker:
         the game is live multiplayer, so there's nothing useful to do offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Squigglepig" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Installed on an iPhone, the status bar is solid black with white
         text, whatever the palette, and the app starts below it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (Messages, WhatsApp, Slack, Discord, social sites). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Squigglepig" />
    <meta property="og:title" content="Play Squigglepig in your browser" />
    <meta property="og:description" content="Draw squiggles, get giggles. A real-time drawing telephone party game for 3 or more players." />
    <meta property="og:url" content="https://play.squigglepig.app/" />
    <meta property="og:image" content="https://play.squigglepig.app/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="The Squigglepig pig: Draw squiggles. Get giggles." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The `react-native-web` recommended style reset (https://necolas.github.io/react-native-web/docs/setup/#root-element),
         plus the page behaving like an app screen rather than a document. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      html {
        /* No pull-to-refresh or swipe-back navigation when a stroke runs off
           the canvas. Browsers read this from the root element, not body. */
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
        /* Teal (dark in dark mode) before the app paints, not a white flash;
           then the app keeps it on the palette (app/_layout.tsx). */
        background-color: #4ecdc4;
        /* Drawing and tapping buttons mustn't select text or flash a highlight. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b1f23;
        }
      }
      /* Installed, the strips round the app are black, like the bars. */
      @media (display-mode: standalone) {
        html,
        body {
          background-color: #000000;
        }
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Squigglepig needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
