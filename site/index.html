<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squigglepig</title>
  <meta name="description" content="Draw squiggles, get giggles. A real-time drawing telephone party game.">
  <meta name="theme-color" content="#06191D">
  <link rel="icon" href="/logo.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Link previews (Messages, WhatsApp, Slack, Discord, social sites). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Squigglepig">
  <meta property="og:title" content="Squigglepig">
  <meta property="og:description" content="Draw squiggles, get giggles. A real-time drawing telephone party game. Play on the web or get the app.">
  <meta property="og:url" content="https://squigglepig.app/">
  <meta property="og:image" content="https://squigglepig.app/og-image.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="500">
  <meta property="og:image:alt" content="The Squigglepig pig: Draw squiggles. Get giggles.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- A neon sign: the pig, the name and the tagline glow and stutter
       together like a tube coming on; the app card shimmers. Everything is
       inline, with no fonts or scripts to fetch. -->
  <style>
    :root {
      --bg: #06191D;
      --teal: #3FF2E6;
      --pink: #FF4FA3;
      --sun: #FFE066;
      --title: #FFF0F7;
      --tagline: #F4FFFE;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      color: #FFFFFF;
      font: 16px/1.5 var(--font);
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255,79,163,.16), transparent 60%),
        radial-gradient(ellipse at 50% 80%, rgba(63,242,230,.12), transparent 60%),
        var(--bg);
    }

    main {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    /* 1. The pig, bobbing, glowing teal round a pink haze. */
    .pig {
      display: block;
      width: 78%;
      max-width: 300px;
      height: auto;
      margin: 0 auto;
      filter:
        drop-shadow(0 0 2px #FFFFFF)
        drop-shadow(0 0 8px var(--teal))
        drop-shadow(0 0 18px var(--teal))
        drop-shadow(0 0 30px var(--pink));
      animation: bob 3s ease-in-out infinite, tubeOn 7s linear infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 2. The tube flicker: the pig, the title and the tagline stutter
          together, twice a cycle. */
    @keyframes tubeOn {
      0%, 7.9% { opacity: 1; }
      8% { opacity: .2; }
      9% { opacity: 1; }
      9.6% { opacity: .45; }
      10.4%, 59% { opacity: 1; }
      59.5% { opacity: .1; }
      61% { opacity: 1; }
      61.6% { opacity: .4; }
      62.4%, 100% { opacity: 1; }
    }

    /* 3. The title, in pink neon. */
    h1 {
      margin: 18px 0 0;
      font-family: var(--font);
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: .01em;
      line-height: 1.1;
      color: var(--title);
      text-shadow: 0 0 2px #fff, 0 0 8px var(--pink), 0 0 18px var(--pink), 0 0 36px var(--pink);
      animation: tubeOn 7s linear infinite;
    }

    /* 4. The tagline, in teal. */
    .lead {
      margin: 12px 0 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--tagline);
      text-shadow: 0 0 2px #fff, 0 0 8px var(--teal), 0 0 18px var(--teal), 0 0 30px var(--teal);
      animation: tubeOn 7s linear infinite;
    }

    /* 5. The app card: teal neon edges, a shimmer sweeping across it. */
    .app {
      position: relative;
      overflow: hidden;
      margin: 30px auto 0;
      padding: 18px 16px 16px;
      border-radius: 18px;
      background: rgba(10,11,18,.85);
      border: 2px solid var(--teal);
      box-shadow: 0 0 6px var(--teal), 0 0 18px rgba(63,242,230,.7), inset 0 0 14px rgba(63,242,230,.35);
    }

    .app::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
      animation: shimmer 3.2s infinite;
    }

    @keyframes shimmer {
      0%, 55% { left: -60%; }
      100% { left: 130%; }
    }

    .app h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--title);
      text-shadow: 0 0 6px var(--pink), 0 0 14px var(--pink);
    }

    /* The two store badges, the same height, side by side where they fit and
       stacked on a phone. */
    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      column-gap: 8px;
    }

    .badge {
      display: inline-block;
      transition: transform .2s ease;
    }

    .badge:hover { transform: scale(1.06); }

    /* Google's own Get it on Google Play badge (google-play-badge.png, from
       play.google.com/intl/en_us/badges, unaltered). Its transparent margin is
       the clear space the badge guidelines ask for, so the image is sized to
       show the badge itself 62px tall (168 of its 250px are badge). */
    .badge img {
      display: block;
      height: 92px;
      width: auto;
    }

    /* Apple's own Download on the App Store badge (app-store-badge.svg, from
       developer.apple.com/app-store/marketing/guidelines, unaltered). It has
       no margin of its own, so it's shown 62px tall like Google's, with a
       margin for the quarter-height clear space Apple asks for. */
    .badge img.apple {
      height: 62px;
      margin: 15px 0;
    }

    /* The trademark notice the badge guidelines ask for, wherever it shows. */
    .legal {
      margin-top: 28px;
      font-size: .7rem;
      color: rgba(255,255,255,.55);
    }

    /* 6. Or play on the web: a sun-yellow neon pill. */
    .alt {
      margin: 24px 0 10px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--sun);
    }

    .neon-btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 999px;
      color: var(--sun);
      border: 2px solid var(--sun);
      font-weight: 800;
      text-decoration: none;
      letter-spacing: .04em;
      text-shadow: 0 0 6px var(--sun), 0 0 14px var(--sun);
      box-shadow: 0 0 6px var(--sun), 0 0 16px rgba(255,224,102,.6), inset 0 0 10px rgba(255,224,102,.3);
      transition: background-color .2s ease, color .2s ease;
    }

    .neon-btn:hover {
      background: var(--sun);
      color: var(--bg);
      text-shadow: none;
    }

    a:focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="pig" src="squigglepig_clear_dark.png" width="978" height="924" alt="">
    <h1>Squigglepig</h1>
    <p class="lead">Draw squiggles, get giggles.</p>

    <section class="app">
      <h2>Get the app</h2>
      <div class="badges">
        <a class="badge" href="https://apps.apple.com/app/id6822231355">
          <img class="apple" src="app-store-badge.svg" width="120" height="40" alt="Download on the App Store">
        </a>
        <a class="badge" href="https://play.google.com/store/apps/details?id=com.squigglepig.app">
          <img src="google-play-badge.png" width="646" height="250" alt="Get it on Google Play">
        </a>
      </div>
    </section>

    <p class="alt">or</p>
    <!-- The web build of the game, served by its own Pages project (see README, Hosting). -->
    <a class="neon-btn" href="https://play.squigglepig.app/">Play on the web</a>

    <p class="legal">Apple and the Apple logo are trademarks of Apple Inc., registered in the U.S. and other countries. App Store is a service mark of Apple Inc.
      Google Play and the Google Play logo are trademarks of Google LLC.</p>
  </main>
</body>
</html>
