<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squigglepig</title>
  <meta name="description" content="Draw squiggles, get giggles. A real-time drawing telephone party game.">
  <link rel="icon" href="/logo.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Link previews (Messages, WhatsApp, Slack, Discord, social sites). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Squigglepig">
  <meta property="og:title" content="Squigglepig">
  <meta property="og:description" content="Draw squiggles, get giggles. A real-time drawing telephone party game. Play on the web or get the app.">
  <meta property="og:url" content="https://squigglepig.app/">
  <meta property="og:image" content="https://squigglepig.app/og-image.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="500">
  <meta property="og:image:alt" content="The Squigglepig pig: Draw squiggles. Get giggles.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <img class="logo" src="/logo.png" alt="Squigglepig">
    <h1>Squigglepig</h1>
    <p>Draw squiggles, get giggles.</p>
    <p>A real-time drawing telephone party game: a prompt becomes a drawing becomes a guess becomes the next drawing, passed around the whole group.</p>

    <!-- The web build of the game, served by its own Pages project (see README, Hosting). -->
    <a class="button" href="https://play.squigglepig.app/">Play on the web</a>

    <p class="note">Or get the app</p>
    <!-- TODO: store URLs. Google Play: https://play.google.com/store/apps/details?id=com.squigglepig.app
         once it's out of closed testing; App Store: once the Apple developer account is set up. -->
    <div class="stores">
      <a class="button secondary" href="#">Google Play</a>
      <a class="button secondary" href="#">App Store</a>
    </div>
  </main>
</body>
</html>
